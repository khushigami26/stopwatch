<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styl/styles.css" />
  </head>

  <body>
    <div class="app-container">
      <h1 class="app-title">Stopwatch</h1>

      <div class="timer-display" id="timerDisplay">00:00:00.00</div>

      <div class="controls">
        <button id="startBtn" class="btn start">Start</button>
        <button id="pauseBtn" class="btn pause">Pause</button>
        <button id="resetBtn" class="btn reset">Reset</button>
        <button id="lapBtn" class="btn lap">Lap</button>
      </div>

      <h2 class="lap-title">Lap Times</h2>
      <ul class="laps-list" id="lapsList"></ul>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
